services:
  db:
    build:
      context: ./deploy/db
    environment:
      POSTGRES_DB: PrimeVideoDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRIMEVIDEO_DB_PASSWORD:?Define PRIMEVIDEO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PrimeVideoDB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - primevideo-db-data:/var/lib/postgresql

  app:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PrimeVideoDB: Host=db;Port=5432;Database=PrimeVideoDB;Username=postgres;Password=${PRIMEVIDEO_DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  primevideo-db-data:
