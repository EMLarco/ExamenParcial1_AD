apiVersion: v1
kind: Namespace
metadata:
  name: primevideo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: primevideo-db-data
  namespace: primevideo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primevideo-db
  namespace: primevideo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: primevideo-db
  template:
    metadata:
      labels:
        app: primevideo-db
    spec:
      containers:
        - name: postgres
          image: primevideo-db:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: primevideo-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "PrimeVideoDB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "PrimeVideoDB"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: primevideo-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: primevideo-db
  namespace: primevideo
spec:
  selector:
    app: primevideo-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primevideo-app
  namespace: primevideo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: primevideo-app
  template:
    metadata:
      labels:
        app: primevideo-app
    spec:
      containers:
        - name: app
          image: primevideo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: primevideo-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: primevideo-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: primevideo-db
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__PrimeVideoDB
              value: Host=primevideo-db;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: primevideo-app
  namespace: primevideo
spec:
  type: NodePort
  selector:
    app: primevideo-app
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
